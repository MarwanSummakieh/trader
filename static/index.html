<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08090d" />
  <title>Trader Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:        #08090d;
      --s1:        #0f1117;
      --s2:        #161820;
      --s3:        #1d2030;
      --border:    rgba(255,255,255,0.06);
      --border2:   rgba(255,255,255,0.10);
      --text:      #f1f5f9;
      --muted:     #94a3b8;
      --dim:       #475569;
      --green:     #34d399;
      --green2:    rgba(52,211,153,0.12);
      --red:       #f87171;
      --red2:      rgba(248,113,113,0.12);
      --amber:     #fbbf24;
      --amber2:    rgba(251,191,36,0.12);
      --indigo:    #818cf8;
      --indigo2:   rgba(129,140,248,0.12);
      --mono:      'JetBrains Mono', monospace;
      --sans:      'Inter', system-ui, sans-serif;
    }

    html { font-size: 13px; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ── Error ───────────────────────────────────────── */
    #err {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 20px;
      background: var(--red2);
      border-bottom: 1px solid var(--red);
      color: var(--red);
      font-size: 12px;
    }
    #err.show { display: flex; }

    /* ── Header ──────────────────────────────────────── */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 14px;
      height: 52px;
      padding: 0 20px;
      background: rgba(8,9,13,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 600;
      background: linear-gradient(135deg, var(--indigo), var(--green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
      white-space: nowrap;
    }

    .hdiv { width: 1px; height: 18px; background: var(--border2); flex-shrink: 0; }

    #clock {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    #market-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all .3s;
      white-space: nowrap;
    }
    #market-pill.open  { background: var(--green2);  color: var(--green);  border: 1px solid rgba(52,211,153,.25); }
    #market-pill.closed{ background: rgba(71,85,105,.15); color: var(--dim); border: 1px solid var(--border2); }

    .pulse {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }
    #market-pill.open .pulse { animation: pulse 2s infinite; }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50%      { opacity: .3; }
    }

    #scan-info { margin-left: auto; font-size: 11px; color: var(--dim); white-space: nowrap; }

    /* ── Stats grid ──────────────────────────────────── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      border-bottom: 1px solid var(--border);
    }
    .metric {
      padding: 14px 20px;
      border-right: 1px solid var(--border);
      transition: background .2s;
      min-width: 0;
    }
    .metric:last-child { border-right: none; }
    .metric:hover { background: var(--s1); }
    .metric-val {
      font-family: var(--mono);
      font-size: 20px;
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .metric-lbl {
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Tabs ────────────────────────────────────────── */
    .tabbar {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 52px;
      z-index: 9;
    }
    .tab {
      appearance: none;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--dim);
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 12px 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: color .15s, border-color .15s;
    }
    .tab:hover { color: var(--muted); }
    .tab.active { color: var(--text); border-bottom-color: var(--indigo); }
    .tab-count {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: 10px;
      background: var(--s3);
      color: var(--muted);
    }
    .tab.active .tab-count { background: var(--indigo2); color: var(--indigo); }

    .tabpanel { display: none; }
    .tabpanel.active { display: block; }
    .panel-body { padding: 16px; max-width: 1100px; }

    /* ── Position cards ──────────────────────────────── */
    .pos-card {
      background: var(--s2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
      transition: border-color .2s, box-shadow .2s;
    }
    .pos-card:hover {
      border-color: var(--border2);
      box-shadow: 0 4px 20px rgba(0,0,0,.4);
    }
    .pos-card:last-child { margin-bottom: 0; }

    .pos-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .pos-ticker {
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 600;
    }
    .pos-type {
      font-size: 10px;
      font-weight: 500;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--s3);
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .pos-pnl {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }

    .pos-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }
    .pos-cell-lbl {
      font-size: 10px;
      color: var(--dim);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 2px;
    }
    .pos-cell-val {
      font-family: var(--mono);
      font-size: 12.5px;
      font-weight: 600;
    }

    /* Price track: shows where price sits between SL and TP */
    .price-track { margin-top: 4px; }
    .price-track-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--dim);
      font-family: var(--mono);
      margin-bottom: 5px;
    }
    .price-track-bar {
      position: relative;
      height: 4px;
      border-radius: 99px;
      background: linear-gradient(to right, var(--red2) 0%, var(--s3) 40%, var(--green2) 100%);
      overflow: visible;
    }
    .track-fill {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      border-radius: 99px;
      background: linear-gradient(to right, rgba(248,113,113,.4), rgba(52,211,153,.6));
      transition: width .4s ease;
    }
    .track-dot {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--text);
      border: 2px solid var(--bg);
      box-shadow: 0 0 6px rgba(255,255,255,.3);
      transition: left .4s ease;
    }
    .track-entry {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 3px; height: 12px;
      border-radius: 2px;
      background: var(--dim);
      transition: left .4s ease;
    }

    /* ── Scan rows ───────────────────────────────────── */
    .scan-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 6px;
      border-radius: 7px;
      transition: background .15s;
      cursor: default;
    }
    .scan-row:hover { background: var(--s2); }

    .scan-rank {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--dim);
      width: 16px;
      text-align: right;
      flex-shrink: 0;
    }

    .score-ring { flex-shrink: 0; }

    .scan-info { flex: 1; min-width: 0; }
    .scan-top {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }
    .scan-ticker {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
    }
    .scan-trend {
      font-size: 10px;
      font-weight: 500;
      padding: 1px 6px;
      border-radius: 4px;
    }
    .trend-bullish { background: var(--green2);  color: var(--green); }
    .trend-bearish { background: var(--red2);    color: var(--red); }
    .trend-neutral { background: var(--amber2);  color: var(--amber); }

    .scan-detail {
      font-size: 10.5px;
      color: var(--dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Orders table ────────────────────────────────── */
    .trades-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .orders-summary {
      padding: 10px 16px 0;
      font-size: 11px;
      color: var(--dim);
    }

    table { width: 100%; border-collapse: collapse; }
    thead th {
      padding: 9px 16px;
      text-align: left;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--dim);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      background: var(--s1);
    }
    tbody td {
      padding: 9px 16px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      font-size: 12.5px;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr { transition: background .15s; }
    tbody tr:hover td { background: var(--s2); }

    .mono { font-family: var(--mono); }

    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: .3px;
    }
    .badge-tp  { background: var(--green2);  color: var(--green); }
    .badge-sl  { background: var(--red2);    color: var(--red); }
    .badge-eod { background: var(--amber2);  color: var(--amber); }
    .badge-tr  { background: var(--indigo2); color: var(--indigo); }

    /* ── Utilities ───────────────────────────────────── */
    .g { color: var(--green); }
    .r { color: var(--red); }
    .a { color: var(--amber); }
    .i { color: var(--indigo); }
    .m { color: var(--muted); }
    .d { color: var(--dim); }
    .fw6 { font-weight: 600; }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 48px 24px;
      color: var(--dim);
      font-size: 12px;
    }
    .empty-state svg { opacity: .3; }

    /* ── Responsive ──────────────────────────────────── */
    @media (max-width: 900px) {
      .stats-row { grid-template-columns: repeat(3, 1fr); }
      .metric:nth-child(3) { border-right: none; }
      .metric:nth-child(-n+3) { border-bottom: 1px solid var(--border); }
      .metric { padding: 12px 16px; }
      .metric-val { font-size: 17px; }
      .metric-lbl { white-space: normal; line-height: 1.4; }
    }

    @media (max-width: 560px) {
      header { padding: 0 12px; gap: 10px; }
      #scan-info { display: none; }
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .metric:nth-child(3) { border-right: 1px solid var(--border); }
      .metric:nth-child(even) { border-right: none; }
      .metric:nth-child(-n+4) { border-bottom: 1px solid var(--border); }
      .metric { padding: 10px 14px; }
      .metric-val { font-size: 16px; }

      .tab { padding: 12px 12px; font-size: 10px; letter-spacing: 1px; flex: 1; justify-content: center; }
      .panel-body { padding: 10px; }
      .pos-grid { grid-template-columns: repeat(2, 1fr); }
      .pos-card { padding: 12px; }

      thead th, tbody td { padding: 8px 7px; }
      .hide-sm { display: none; }
    }
  </style>
</head>
<body>

<div id="err">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
  Server unreachable — run <code style="background:rgba(255,255,255,.1);padding:1px 5px;border-radius:3px">python server.py</code>
</div>

<header>
  <span class="logo">◈ TRADER</span>
  <div class="hdiv"></div>
  <span id="clock">--:--:--</span>
  <div class="hdiv"></div>
  <div id="market-pill" class="closed">
    <span class="pulse"></span>
    <span id="market-txt">MARKET CLOSED</span>
  </div>
  <span id="scan-info">—</span>
</header>

<div class="stats-row">
  <div class="metric">
    <div class="metric-val i" id="m-capital">$—</div>
    <div class="metric-lbl">Capital</div>
  </div>
  <div class="metric">
    <div class="metric-val" id="m-deployed">$—</div>
    <div class="metric-lbl" id="m-deployed-lbl">Deployed</div>
  </div>
  <div class="metric">
    <div class="metric-val" id="m-positions">—</div>
    <div class="metric-lbl">Positions</div>
  </div>
  <div class="metric">
    <div class="metric-val" id="m-today">$—</div>
    <div class="metric-lbl" id="m-today-lbl">Today Realized</div>
  </div>
  <div class="metric">
    <div class="metric-val" id="m-today-est">$—</div>
    <div class="metric-lbl" id="m-today-est-lbl">Today Est.</div>
  </div>
  <div class="metric">
    <div class="metric-val" id="m-total">$—</div>
    <div class="metric-lbl" id="m-total-lbl">All-Time P&L</div>
  </div>
</div>

<div class="tabbar">
  <button class="tab active" data-tab="positions">
    Positions <span class="tab-count" id="tc-positions">0</span>
  </button>
  <button class="tab" data-tab="scans">
    Scans <span class="tab-count" id="tc-scans">0</span>
  </button>
  <button class="tab" data-tab="orders">
    Orders <span class="tab-count" id="tc-orders">0</span>
  </button>
</div>

<section class="tabpanel active" id="tab-positions">
  <div class="panel-body" id="pos-body">
    <div class="empty-state">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      No open positions
    </div>
  </div>
</section>

<section class="tabpanel" id="tab-scans">
  <div class="panel-body" id="scan-body">
    <div class="empty-state">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      Waiting for first scan…
    </div>
  </div>
</section>

<section class="tabpanel" id="tab-orders">
  <div class="orders-summary" id="trades-summary"></div>
  <div class="trades-wrap">
    <table>
      <thead>
        <tr>
          <th>Ticker</th><th class="hide-sm">Type</th><th>Entry</th>
          <th class="hide-sm">Exit</th>
          <th>P&L</th><th class="hide-sm">P&L %</th><th>Result</th>
          <th class="hide-sm">Opened</th><th>Closed</th>
        </tr>
      </thead>
      <tbody id="trades-body">
        <tr><td colspan="9"><div class="empty-state">No closed trades yet</div></td></tr>
      </tbody>
    </table>
  </div>
</section>

<script>
const $ = id => document.getElementById(id);
const API = '';

// ── Tabs ────────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tabpanel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    $('tab-' + btn.dataset.tab).classList.add('active');
    try { localStorage.setItem('trader-tab', btn.dataset.tab); } catch(_) {}
  });
});
try {
  const saved = localStorage.getItem('trader-tab');
  if (saved) document.querySelector(`.tab[data-tab="${saved}"]`)?.click();
} catch(_) {}

// ── Formatting ──────────────────────────────────────────────────────────────
function usd(n, sign = false) {
  if (n == null) return '—';
  const s = Math.abs(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  return (sign ? (n >= 0 ? '+' : '-') : (n < 0 ? '-' : '')) + '$' + s;
}
function pct(n, sign = false) {
  if (n == null) return '—';
  return (sign && n >= 0 ? '+' : '') + n.toFixed(2) + '%';
}
function pc(n)  { return n >= 0 ? 'g' : 'r'; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// ── Score ring (SVG arc) ────────────────────────────────────────────────────
function scoreRing(score) {
  const r = 14, cx = 16, cy = 16;
  const c = 2 * Math.PI * r;
  const fill = c * (score / 100);
  const color = score >= 65 ? '#34d399' : score >= 45 ? '#fbbf24' : '#f87171';
  return `<svg class="score-ring" width="32" height="32" viewBox="0 0 32 32">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="3"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="3"
      stroke-dasharray="${fill} ${c}" stroke-dashoffset="${c * 0.25}"
      stroke-linecap="round" style="transition:stroke-dasharray .4s"/>
    <text x="${cx}" y="${cy}" dominant-baseline="central" text-anchor="middle"
      fill="${color}" font-family="JetBrains Mono,monospace" font-size="8" font-weight="600">${score}</text>
  </svg>`;
}

// ── Price track bar ─────────────────────────────────────────────────────────
function priceTrack(p) {
  const range = p.take_profit - p.stop_loss;
  if (range <= 0) return '';
  const ep = clamp((p.entry_price   - p.stop_loss) / range * 100, 0, 100);
  const np = clamp((p.current_price - p.stop_loss) / range * 100, 0, 100);
  return `
  <div class="price-track">
    <div class="price-track-labels">
      <span class="r">SL $${p.stop_loss.toFixed(2)}</span>
      <span class="g">TP $${p.take_profit.toFixed(2)}</span>
    </div>
    <div class="price-track-bar">
      <div class="track-fill" style="width:${np}%"></div>
      <div class="track-entry" style="left:${ep}%"></div>
      <div class="track-dot" style="left:${np}%"></div>
    </div>
  </div>`;
}

// ── Renderers ───────────────────────────────────────────────────────────────
function renderHeader(s) {
  $('clock').textContent = s.time + ' ' + s.timezone;
  const pill = $('market-pill');
  $('market-txt').textContent = s.market_open ? 'MARKET OPEN' : 'MARKET CLOSED';
  pill.className = s.market_open ? 'open' : 'closed';
  $('scan-info').textContent = s.last_scan_time ? 'last scan ' + s.last_scan_time : '';
}

function renderStats(s, st) {
  $('m-capital').textContent  = usd(s.capital);
  $('m-deployed').textContent = usd(s.capital_deployed);
  $('m-deployed-lbl').textContent = 'Deployed · ' + usd(s.available_capital) + ' free';
  $('m-positions').textContent = s.position_count + ' / ' + s.max_positions;

  const today = st.today || {};
  const realized = today.total_pnl || 0;
  const unreal = s.unrealized_pnl || 0;
  const est = realized + unreal;
  // Capital at the start of the day ≈ current capital minus today's realized
  const dayBase = (s.capital || 0) - realized;

  const tEl = $('m-today');
  tEl.textContent = usd(realized, true);
  tEl.className = 'metric-val ' + pc(realized);
  $('m-today-lbl').textContent =
    'Today Realized · ' + (today.total_trades || 0) + ' trades'
    + (today.total_trades ? ' · ' + (today.win_rate || 0).toFixed(0) + '% win' : '');

  const eEl = $('m-today-est');
  eEl.textContent = usd(est, true);
  eEl.className = 'metric-val ' + pc(est);
  $('m-today-est-lbl').textContent =
    'Today Est. · ' + (dayBase > 0 ? pct(est / dayBase * 100, true) : '—')
    + ' · ' + usd(unreal, true) + ' open';

  const pnl = st.total_pnl || 0;
  const aEl = $('m-total');
  aEl.textContent = usd(pnl, true);
  aEl.className = 'metric-val ' + pc(pnl);
  $('m-total-lbl').textContent =
    'All-Time P&L · ' + (st.total_trades || 0) + ' trades · '
    + (st.win_rate || 0).toFixed(0) + '% win';
}

function renderPositions(positions) {
  $('tc-positions').textContent = positions.length;
  if (!positions.length) {
    $('pos-body').innerHTML = `<div class="empty-state">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      No open positions</div>`;
    return;
  }
  $('pos-body').innerHTML = positions.map(p => {
    const dir = p.current_price >= p.entry_price ? '▲' : '▼';
    const c   = pc(p.unrealized_pnl);
    const sign = p.unrealized_pnl >= 0 ? '+' : '';
    return `
    <div class="pos-card">
      <div class="pos-header">
        <span class="pos-ticker">${p.ticker}</span>
        <span class="pos-type">${p.asset_type}</span>
        <span class="pos-pnl ${c}">${sign}${usd(p.unrealized_pnl)} <span style="font-size:11px;font-weight:400">(${sign}${pct(p.unrealized_pnl_pct)})</span></span>
      </div>
      <div class="pos-grid">
        <div>
          <div class="pos-cell-lbl">Entry</div>
          <div class="pos-cell-val mono">$${p.entry_price.toFixed(2)}</div>
        </div>
        <div>
          <div class="pos-cell-lbl">Now ${dir}</div>
          <div class="pos-cell-val mono ${c}">$${p.current_price.toFixed(2)}</div>
        </div>
        <div>
          <div class="pos-cell-lbl">Qty</div>
          <div class="pos-cell-val mono">${p.quantity.toFixed(3)}</div>
        </div>
        <div>
          <div class="pos-cell-lbl">Since</div>
          <div class="pos-cell-val d">${p.entry_time}</div>
        </div>
      </div>
      ${priceTrack(p)}
    </div>`;
  }).join('');
}

function renderScans(scans) {
  $('tc-scans').textContent = scans.length;
  if (!scans.length) {
    $('scan-body').innerHTML = `<div class="empty-state">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      Waiting for first scan…</div>`;
    return;
  }
  $('scan-body').innerHTML = scans.map((s, i) => {
    const trendCls = s.trend === 'bullish' ? 'trend-bullish' : s.trend === 'bearish' ? 'trend-bearish' : 'trend-neutral';
    let signals = [];
    try { signals = JSON.parse(s.signals || '[]'); } catch(_) {}
    const detail = [`$${parseFloat(s.price).toFixed(2)}`, `RSI ${parseFloat(s.rsi).toFixed(0)}`, `Vol ${parseFloat(s.volume_ratio).toFixed(1)}x`, ...signals.slice(0,2)].join(' · ');
    return `
    <div class="scan-row">
      <span class="scan-rank">${i+1}</span>
      ${scoreRing(s.score)}
      <div class="scan-info">
        <div class="scan-top">
          <span class="scan-ticker">${s.ticker}</span>
          <span class="scan-trend ${trendCls}">${s.trend}</span>
        </div>
        <div class="scan-detail">${detail}</div>
      </div>
    </div>`;
  }).join('');
}

const REASONS = {
  take_profit: ['Target', 'badge-tp'],
  stop_loss:   ['Stop',   'badge-sl'],
  trail_stop:  ['Trail',  'badge-tr'],
  margin_call: ['Margin', 'badge-sl'],
  eod_close:   ['EOD',    'badge-eod'],
  manual_close:['Manual', 'badge-eod'],
};

function renderTrades(trades, stats) {
  $('tc-orders').textContent = trades.length;
  if (stats.total_trades) {
    $('trades-summary').textContent =
      `best ${usd(stats.best_trade,true)} · worst ${usd(stats.worst_trade,true)} · avg ${pct(stats.avg_pnl_pct,true)}`;
  }
  if (!trades.length) {
    $('trades-body').innerHTML = '<tr><td colspan="9"><div class="empty-state">No closed trades yet</div></td></tr>';
    return;
  }
  $('trades-body').innerHTML = trades.map(t => {
    const c = pc(t.pnl || 0);
    const sign = (t.pnl || 0) >= 0 ? '+' : '';
    const [label, rb] = REASONS[t.exit_reason] || [t.exit_reason || '—', 'badge-eod'];
    return `<tr>
      <td class="mono fw6">${t.ticker}</td>
      <td class="d hide-sm">${t.asset_type}</td>
      <td class="mono">$${t.entry_price.toFixed(2)}</td>
      <td class="mono hide-sm">${t.exit_price != null ? '$' + t.exit_price.toFixed(2) : '—'}</td>
      <td class="mono ${c}">${t.pnl != null ? sign + usd(t.pnl) : '—'}</td>
      <td class="mono ${c} hide-sm">${t.pnl_pct != null ? sign + t.pnl_pct.toFixed(2) + '%' : '—'}</td>
      <td><span class="badge ${rb}">${label}</span></td>
      <td class="d hide-sm">${t.entry_time}</td>
      <td class="d">${t.exit_time}</td>
    </tr>`;
  }).join('');
}

// ── Poll ────────────────────────────────────────────────────────────────────
async function refresh() {
  try {
    const [status, positions, scans, trades, stats] = await Promise.all([
      fetch(`${API}/api/status`).then(r => r.json()),
      fetch(`${API}/api/positions`).then(r => r.json()),
      fetch(`${API}/api/scans`).then(r => r.json()),
      fetch(`${API}/api/trades`).then(r => r.json()),
      fetch(`${API}/api/stats`).then(r => r.json()),
    ]);
    $('err').classList.remove('show');
    renderHeader(status);
    renderStats(status, stats);
    renderPositions(positions);
    renderScans(scans);
    renderTrades(trades, stats);
  } catch(e) {
    $('err').classList.add('show');
  }
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
