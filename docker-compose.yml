services:

  bot:
    build: .
    command: python main.py
    env_file: .env
    environment:
      - DB_PATH=/app/data/ledger.db
    volumes:
      - trader_data:/app/data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  server:
    build: .
    command: python server.py
    env_file: .env
    environment:
      - DB_PATH=/app/data/ledger.db
    volumes:
      - trader_data:/app/data
    ports:
      - "5000:5000"
    restart: unless-stopped
    depends_on:
      - bot

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - server

volumes:
  trader_data:
